name: Shadow Sync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install pillow opencv-python numpy
      - name: Run Shadow Engine
        run: |
          python src/shadow_engine.py
